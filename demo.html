/* Layout: one phone screen per tab (Week, Audit, Live, Planner). Big headline number, bars instead of tables, bottom tab bar. Single dark theme by choice. */
:root{
  --bg:#0e1014; --surface:#171a21; --raise:#1f232c; --line:#2a2f3a;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--body)}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:rgba(14,16,20,.92);backdrop-filter:blur(10px);padding:calc(14px + env(safe-area-inset-top)) 18px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font:600 17px var(--display);letter-spacing:.01em;display:flex;align-items:center;gap:10px}

.chip{font-size:12px;color:var(--mute);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px 10px;white-space:nowrap}
.chip.warn{color:var(--warn);border-color:rgba(255,179,64,.4)}
main{max-width:560px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:16px}
.tab{display:none;flex-direction:column;gap:16px}
.tab.on{display:flex}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}

.hero{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:132px;height:132px;flex:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--raise);border-radius:16px;padding:12px;min-width:0}

.band:first-of-type{border-top:0;padding-top:0}

&lt;script&gt;
/* ===== Contract rules (A8 audit table and the policy PDF) ===== */
const COUNTS=[&#x27;avail&#x27;,&#x27;turnout&#x27;,&#x27;drill&#x27;,&#x27;rota&#x27;,&#x27;leave&#x27;], NEVER=[&#x27;detach&#x27;,&#x27;unavail&#x27;,&#x27;course&#x27;];
const WEEKLY={P1:35,P3:13,P4:12,U:25};
const SPEC_BY_SUB={Prime:60,C:54,B:46,A:39};
const CONTRACT=85, WEEKS=8, WINDOW_DAYS=56;
function toMin(t){const[h,m]=t.split(&#x27;:&#x27;).map(Number);return h*60+m}
function entryHours(e){let d=toMin(e.end)-toMin(e.start);if(d&lt;=0)d+=1440;return d/60}
function dayNum(s){const[y,m,d]=s.split(&#x27;-&#x27;).map(Number);return Math.round(Date.UTC(y,m-1,d)/86400000)}
function calcRange(entries,from,to,now){
  const mk=()=&gt;({P1:0,P3:0,P4:0,U:0,ABS:0}), done=mk(), all=mk();
  for(const e of entries){
    const dn=dayNum(e.date); if(dn&lt;from||dn&gt;=to) continue;
    const h=entryHours(e), s=new Date(e.date+&#x27;T&#x27;+e.start).getTime();
    const dh=Math.max(0,Math.min(h,(now-s)/36e5));
    if(e.type===&#x27;absence&#x27;){all.ABS+=h*CONTRACT/168;done.ABS+=dh*CONTRACT/168}
    else if(COUNTS.includes(e.type)&amp;&amp;all[e.band]!==undefined){all[e.band]+=h;done[e.band]+=dh}
  }
  const fin=o=&gt;Object.assign(o,{S:o.P1+o.P3+o.P4,T:o.P1+o.P3+o.P4+o.U+o.ABS});
  return{done:fin(done),all:fin(all)};
}

&lt;script&gt;
const $=id=&gt;document.getElementById(id);
const KEY=&#x27;oncall-tracker-v2&#x27;;
let entries=[], source=&#x27;none&#x27;, importedAt=null, weekStart=0, offViewWeek=null;
const pad=n=&gt;String(n).padStart(2,&#x27;0&#x27;);
const iso=dn=&gt;{const d=new Date(dn*86400000);return d.getUTCFullYear()+&#x27;-&#x27;+pad(d.getUTCMonth()+1)+&#x27;-&#x27;+pad(d.getUTCDate())};
const mondayNum=dn=&gt;dn-((new Date(dn*86400000).getUTCDay()+6)%7);
const f1=n=&gt;(Math.round(n*10)/10).toFixed(1);
const f2=n=&gt;(Math.round(n*100)/100).toFixed(2);
const fm=dn=&gt;new Date(dn*86400000).toLocaleDateString(&#x27;en-GB&#x27;,{day:&#x27;numeric&#x27;,month:&#x27;short&#x27;,timeZone:&#x27;UTC&#x27;});
function defaultAudit(){const n=new Date();let y=n.getFullYear(),m=n.getMonth()+2;if(m&gt;12){m=1;y++}return y+&#x27;-&#x27;+pad(m)+&#x27;-01&#x27;}
function inWindow(e,audit){const a=dayNum(audit),x=dayNum(e.date);return x&gt;=a-WINDOW_DAYS&amp;&amp;x&lt;a}

function save(){try{localStorage.setItem(KEY,JSON.stringify({entries,source,importedAt,audit:$(&#x27;auditDate&#x27;).value,sub:$(&#x27;sub&#x27;).value}))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||&#x27;null&#x27;);if(s){entries=s.entries||[];source=s.source||&#x27;none&#x27;;importedAt=s.importedAt||null;if(s.audit)$(&#x27;auditDate&#x27;).value=s.audit;if(s.sub)$(&#x27;sub&#x27;).value=s.sub;return true}}catch(e){}return false}

function ring(all,target,met){
  const r=54,c=2*Math.PI*r,p=Math.max(0,Math.min(1,target?all/target:0));
  return &#x27;&lt;svg viewBox=&quot;0 0 132 132&quot; aria-hidden=&quot;true&quot;&gt;&lt;circle cx=&quot;66&quot; cy=&quot;66&quot; r=&quot;&#x27;+r+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;var(--raise)&quot; stroke-width=&quot;12&quot;/&gt;&lt;circle cx=&quot;66&quot; cy=&quot;66&quot; r=&quot;&#x27;+r+&#x27;&quot; fill=&quot;none&quot; stroke=&quot;&#x27;+(met?&#x27;var(--good)&#x27;:&#x27;var(--accent)&#x27;)+&#x27;&quot; stroke-width=&quot;12&quot; stroke-linecap=&quot;round&quot; stroke-dasharray=&quot;&#x27;+(c*p)+&#x27; &#x27;+c+&#x27;&quot;/&gt;&lt;/svg&gt;&#x27;;
}
function hero(r,tT,tS,label){
  const spec=r.all.S+r.all.ABS, ok=spec&gt;=tS-0.005&amp;&amp;r.all.T&gt;=tT-0.005;
  const shortS=Math.max(0,tS-spec), shortT=Math.max(0,tT-r.all.T);
  return &#x27;&lt;div class=&quot;ring&quot;&gt;&#x27;+ring(r.all.T,tT,ok)+&#x27;&lt;div class=&quot;num&quot;&gt;&lt;b&gt;&#x27;+f1(r.all.T)+&#x27;&lt;/b&gt;&lt;span&gt;of &#x27;+tT+&#x27; h&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;
   +&#x27;&lt;div class=&quot;verdict&quot;&gt;&lt;span class=&quot;pill &#x27;+(ok?&#x27;ok&#x27;:&#x27;no&#x27;)+&#x27;&quot;&gt;&#x27;+(ok?&#x27;On track&#x27;:&#x27;Short&#x27;)+&#x27;&lt;/span&gt;&#x27;
   +&#x27;&lt;p&gt;&#x27;+(ok?&#x27;Specified and total both met&#x27;:&#x27;Short &lt;strong&gt;&#x27;+f1(shortS)+&#x27; h&lt;/strong&gt; specified, &lt;strong&gt;&#x27;+f1(shortT)+&#x27; h&lt;/strong&gt; total&#x27;)+&#x27;&lt;/p&gt;&#x27;
   +&#x27;&lt;p&gt;&#x27;+label+&#x27;&lt;/p&gt;&lt;p&gt;Done &lt;strong&gt;&#x27;+f1(r.done.T)+&#x27;&lt;/strong&gt; · Booked ahead &lt;strong&gt;&#x27;+f1(r.all.T-r.done.T)+&#x27;&lt;/strong&gt;&lt;/p&gt;&lt;/div&gt;&#x27;;
}
function band(name,sub,done,all,target){
  const pd=Math.min(100,target?done/target*100:0), pa=Math.min(100-pd,target?(all-done)/target*100:0), met=all&gt;=target-0.005, diff=all-target;
  return &#x27;&lt;div class=&quot;band&quot;&gt;&lt;div class=&quot;bhead&quot;&gt;&lt;div class=&quot;bname&quot;&gt;&#x27;+name+&#x27;&lt;small&gt;&#x27;+sub+&#x27;&lt;/small&gt;&lt;/div&gt;&lt;div class=&quot;bnum&quot;&gt;&#x27;+f1(all)+&#x27; &lt;span style=&quot;color:var(--mute);font-weight:400&quot;&gt;/ &#x27;+f1(target)+&#x27; h&lt;/span&gt;&lt;small&gt;&lt;span class=&quot;diff &#x27;+(met?&#x27;ok&#x27;:&#x27;no&#x27;)+&#x27;&quot;&gt;&#x27;+(diff&gt;=0?&#x27;+&#x27;:&#x27;&#x27;)+f1(diff)+&#x27;&lt;/span&gt;&lt;/small&gt;&lt;/div&gt;&lt;/div&gt;&#x27;
   +&#x27;&lt;div class=&quot;track &#x27;+(met?&#x27;met&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;div class=&quot;seg-done&quot; style=&quot;width:&#x27;+pd+&#x27;%&quot;&gt;&lt;/div&gt;&lt;div class=&quot;seg-book&quot; style=&quot;width:&#x27;+pa+&#x27;%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;
}
function weeklyBand(name,sub,done,all,target){
  const doneWidth=Math.max(0,Math.min(100,done/target*100));
  const aheadWidth=Math.max(0,Math.min(100-doneWidth,(all-done)/target*100));
  const diff=all-target;

(function(){
  const storageKey=&#x27;oncall-booking-results&#x27;;
  const idPattern=/^[a-zA-Z0-9-]{8,64}$/;
  const messages={
    queued:&#x27;Sent to relay · Waiting for FireWatch&#x27;,
    claimed:&#x27;Picked up by Autobook&#x27;,
    booking:&#x27;Booking in FireWatch&#x27;,
    booked:&#x27;Booked off · Confirmed present in FireWatch (new or existing)&#x27;,
    failed:&#x27;Check FireWatch · Autobook could not complete or verify this booking&#x27;,
    stalled:&#x27;Check FireWatch · Autobook stopped reporting progress&#x27;,
    unavailable:&#x27;Awaiting confirmation · Status temporarily unavailable&#x27;,
    missing:&#x27;Check FireWatch · Booking result unavailable&#x27;,
    reconciled:&#x27;Owner reconciled a missing relay attempt · Nothing automatically resent&#x27;

  const final=new Set([&#x27;booked&#x27;,&#x27;failed&#x27;,&#x27;reconciled&#x27;]);
  let results=[];
  try {
    const saved=JSON.parse(localStorage.getItem(storageKey)||&#x27;[]&#x27;);
    if(Array.isArray(saved))results=saved.filter(item=&gt;item&amp;&amp;idPattern.test(item.id)&amp;&amp;Number.isFinite(item.at)).slice(0,10);
  } catch {}
  const list=document.getElementById(&#x27;booking-result-list&#x27;);
  function render(){
    if(!results.length)return;
    list.replaceChildren(...results.map(item=&gt;{
      const li=document.createElement(&#x27;li&#x27;);
      li.dataset.status=item.status;
      const time=new Intl.DateTimeFormat(&#x27;en-GB&#x27;,{dateStyle:&#x27;short&#x27;,timeStyle:&#x27;short&#x27;,timeZone:&#x27;Europe/London&#x27;}).format(item.at);
      const message=document.createElement(&#x27;strong&#x27;);
      message.textContent=messages[item.status]||messages.queued;
      const stamp=document.createElement(&#x27;div&#x27;);
      stamp.className=&#x27;booking-result-time&#x27;;
      stamp.textContent=time;
      const why=document.createElement(&#x27;div&#x27;);why.className=&#x27;booking-result-time&#x27;;if(item.report&amp;&amp;item.status!==&#x27;booked&#x27;)why.textContent=String(item.report).split(&#x27;\n&#x27;)[0].replace(/^Check FireWatch:\s*/,&#x27;&#x27;).slice(0,200);li.append(message,stamp,why);
      return li;
    }));
  }
  function save(){try{localStorage.setItem(storageKey,JSON.stringify(results))}catch{}}
  let checking=false;
  async function refresh(){
    if(checking||document.hidden)return;
    const pending=results.filter(item=&gt;!final.has(item.status));
    if(!pending.length)return;
    let key;
    try{key=localStorage.getItem(&#x27;oncall-relay-key&#x27;)}catch{return}
    if(!key)return;
    checking=true;
    try{
      await Promise.all(pending.map(async item=&gt;{
        const controller=new AbortController();
        const timeout=setTimeout(()=&gt;controller.abort(),8000);
        try{
          const response=await fetch(RELAY_URL+&#x27;/status?id=&#x27;+encodeURIComponent(item.id),{headers:{&#x27;X-Relay-Key&#x27;:key},cache:&#x27;no-store&#x27;,signal:controller.signal});

          const previousStatus=item.status;
          item.status=body&amp;&amp;body.ok&amp;&amp;body.id===item.id&amp;&amp;Object.hasOwn(messages,body.status)?(body.status===&#x27;booked&#x27;&amp;&amp;!body.readbackVerified?&#x27;missing&#x27;:body.status):&#x27;unavailable&#x27;;

        }catch{item.status=&#x27;unavailable&#x27;}

    }finally{checking=false}

  window.trackBookingResult=function(receipt){
    if(!idPattern.test(receipt.id)||typeof receipt.id!==&#x27;string&#x27;)return;
    if(receipt.replacesId&amp;&amp;receipt.replacesId!==receipt.id)results=results.filter(item=&gt;item.id!==receipt.replacesId);

})();

/* Server-bound Book Off approval. No locally generated booking challenges. */
(function(root){
  &#x27;use strict&#x27;;
  const encode = a =&gt; btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g,&#x27;-&#x27;).replace(/\//g,&#x27;_&#x27;).replace(/=+$/,&#x27;&#x27;);

  function options(p,registration){
    const result={...p,challenge:decode(p.challenge)};
    if(registration)result.user={...p.user,id:decode(p.user.id)};
    for(const k of [&#x27;allowCredentials&#x27;,&#x27;excludeCredentials&#x27;])if(p[k])result[k]=p[k].map(c=&gt;({...c,id:decode(c.id)}));
    return result;
  }
  function response(c){
    if(!c)throw Error(&#x27;Verification not completed&#x27;);
    const r={clientDataJSON:encode(c.response.clientDataJSON)};
    for(const k of [&#x27;authenticatorData&#x27;,&#x27;signature&#x27;,&#x27;attestationObject&#x27;])if(c.response[k])r[k]=encode(c.response[k]);
    if(c.response.userHandle)r.userHandle=encode(c.response.userHandle);
    if(c.response.getTransports)r.transports=c.response.getTransports();
    return {id:c.id,rawId:encode(c.rawId),type:c.type,response:r,clientExtensionResults:c.getClientExtensionResults?.()||{}};
  }
  function create({url,key,storage,fetch:send=root.fetch.bind(root),credentials=root.navigator?.credentials,verify}){
    let busy=false;
    async function call(path,body,owner){
      const r=await send(url+path,{
        method:body?&#x27;POST&#x27;:&#x27;GET&#x27;,headers:{&#x27;Content-Type&#x27;:&#x27;application/json&#x27;,&#x27;X-Relay-Key&#x27;:key,...(owner?{&#x27;X-Owner-Enrollment&#x27;:owner}:{})},
        body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000),cache:&#x27;no-store&#x27;,
      });
      const j=await r.json();
      if(!r.ok||!j.ok){const error=Error(j.error||&#x27;Relay rejected request&#x27;);error.status=r.status;throw error}

    }
    async function approve(b,{probe=false}={}){
      const j=await call(&#x27;/auth/book-off/options&#x27;,b);
      try{
        const c=await verify(signal=&gt;credentials.get({signal,publicKey:options(j.publicKey,false)}));
        if(!c){await call(&#x27;/auth/book-off/cancel&#x27;,{approvalId:j.approvalId}).catch(()=&gt;{});return null}

        return approval;
      }catch(e){await call(&#x27;/auth/book-off/cancel&#x27;,{approvalId:j.approvalId}).catch(()=&gt;{});throw e}
    }
    async function submit(text){
      if(busy)return {ok:false,state:&#x27;busy&#x27;,message:&#x27;Another approval is in progress. Nothing else sent.&#x27;};
      busy=true;
      let record,identity;
      try{
        if(!root.isSecureContext||!credentials?.get)return {ok:false,state:&#x27;unsupported&#x27;,message:&#x27;System verification unavailable. Nothing sent.&#x27;};
        const config=await call(&#x27;/auth/config&#x27;);
        if(config.mode!==&#x27;enforce&#x27;)return {ok:false,state:&#x27;preparation&#x27;,message:&#x27;Booking approval is not enabled yet. Setup/probe only; nothing sent.&#x27;};
        identity=encode(await crypto.subtle.digest(&#x27;SHA-256&#x27;,new TextEncoder().encode(text)));

      }finally{busy=false}

    }
    async function probe(){
      // Intentionally fake dates; this endpoint can NEVER enter the booking queue.
      const b={id:crypto.randomUUID(),text:&#x27;Passkey probe only\n#BOOK [{&quot;from&quot;:&quot;2099-01-05T18:00&quot;,&quot;to&quot;:&quot;2099-01-06T06:00&quot;}]&#x27;};
      return approve(b,{probe:true});
    }
    async function reconcile(text){
      if(busy)return {ok:false,state:&#x27;busy&#x27;,message:&#x27;Another approval is in progress.&#x27;};
      busy=true;
      try{
        const hash=encode(await crypto.subtle.digest(&#x27;SHA-256&#x27;,new TextEncoder().encode(text))),k=&#x27;oncall-approved-book-off:&#x27;+hash;
        const record=JSON.parse(storage.getItem(k)||&#x27;null&#x27;);
        if(!record)return {ok:false,message:&#x27;No saved attempt to reconcile.&#x27;};
        try{
          const status=await call(&#x27;/status?id=&#x27;+encodeURIComponent(record.id));
          root.trackBookingResult?.(status);
          return {ok:false,message:&#x27;Relay has this request. Check Booking results and FireWatch; do not resend.&#x27;};
        }catch(e){if(e.status!==404)throw e}
        if(Date.now()-record.at&lt;180000)return {ok:false,message:&#x27;Wait at least three minutes after the attempt, then check again. Nothing sent.&#x27;};
        const b={id:crypto.randomUUID(),text};
        const proof=await approve(b,{probe:true});
        if(!proof?.verified||proof.queued!==false)return {ok:false,message:&#x27;Not verified. Retry protection retained.&#x27;};
        storage.removeItem(k);
        root.trackBookingResult?.({id:record.id,reconciled:true});
        return {ok:false,state:&#x27;reconciled&#x27;,message:&#x27;Retry protection reset after owner verification. Nothing queued. Review the dates and send again for a fresh approval.&#x27;};
      }catch(e){return {ok:false,message:&#x27;Could not reconcile. Retry protection retained. &#x27;+e.message}}
      finally{busy=false}
    }
    return {submit,enrol,probe,reconcile};
  }
  root.BookOffSecurity={create,options,response};
})(globalThis);

(() =&gt; {
  const section = document.getElementById(&#x27;winterton-events&#x27;);
  const status = document.getElementById(&#x27;winterton-events-status&#x27;);
  const list = document.getElementById(&#x27;winterton-events-list&#x27;);
  const connect = document.getElementById(&#x27;winterton-events-connect&#x27;);
  const planner = document.getElementById(&#x27;planner-event-history&#x27;);
  const source = document.getElementById(&#x27;station-data-source&#x27;);
  const endpoint = &#x27;https://live-crewing-winterton-events.paulm-crewing.workers.dev/events&#x27;;
  let credential = &#x27;&#x27;;
  let pending = false;
  let snapshot = null;
  let type = &#x27;&#x27;;
  let person = &#x27;&#x27;;
  let position = 0;

  function element(tag, value) {
    const node = document.createElement(tag);
    if (value != null) node.textContent = value;
    return node;
  }

  function selector(label, values, selected, change) {
    const wrapper = element(&#x27;label&#x27;, label+&#x27; &#x27;);
    const select = element(&#x27;select&#x27;);
    for (const value of values) {
      const option = element(&#x27;option&#x27;, value || &#x27;All&#x27;);
      option.value = value;
      select.append(option);
    }
    select.value = selected;
    select.addEventListener(&#x27;change&#x27;, () =&gt; {
      change(select.value);
      position = 0;
      render();

    });

  }

  function render() {
    const events = [...snapshot.events].sort((a, b) =&gt; b.start.localeCompare(a.start));
    const types = [...new Set(events.map(event =&gt; event.type))].sort();
    if (type &amp;&amp; !types.includes(type)) type = &#x27;&#x27;;
    const typed = events.filter(event =&gt; !type || event.type === type);
    const names = [...new Set(typed.flatMap(event =&gt; event.people.map(item =&gt; item.name)))].sort();
    if (person &amp;&amp; !names.includes(person)) person = &#x27;&#x27;;
    const matches = typed.filter(event =&gt; !person || event.people.some(item =&gt; item.name === person));
    position = Math.min(position, Math.max(0, matches.length - 1));
    list.replaceChildren(
      selector(&#x27;Event type&#x27;, [&#x27;&#x27;, ...types], type, value =&gt; {type = value; person = &#x27;&#x27;}),
      selector(&#x27;Crew member&#x27;, [&#x27;&#x27;, ...names], person, value =&gt; {person = value})
    );
    const event = matches[position];
    if (!event) {
      list.append(element(&#x27;p&#x27;, &#x27;No matching Winterton events.&#x27;));
      return;
    }
    const fields = element(&#x27;dl&#x27;);
    const add = (label, value) =&gt; fields.append(element(&#x27;dt&#x27;, label), element(&#x27;dd&#x27;, value ?? &#x27;Unavailable in FireWatch export&#x27;));
    add(&#x27;Event time&#x27;, event.start + &#x27; to &#x27; + event.end);
    add(&#x27;Added by&#x27;, event.createdBy);
    add(&#x27;Added at&#x27;, event.createdAt);
    add(&#x27;Event comment&#x27;, event.comment ?? &#x27;No comment supplied&#x27;);
    const personnel = person ? event.people.filter(item =&gt; item.name === person) : event.people;
    for (const item of personnel) add(item.name, item.comment ?? &#x27;No personnel comment supplied&#x27;);
    const navigation = element(&#x27;div&#x27;);
    navigation.className = &#x27;pseg&#x27;;
    function button(label, step) {
      const control = element(&#x27;button&#x27;, label);
      control.type = &#x27;button&#x27;;
      control.disabled = position + step &lt; 0 || position + step &gt;= matches.length;
      control.addEventListener(&#x27;click&#x27;, () =&gt; {
        position += step;
        render();
        const buttons = [...list.querySelectorAll(&#x27;button:not(:disabled)&#x27;)];
        (buttons.find(item =&gt; item.textContent === label) || buttons[0])?.focus();

      return control;

    counter.setAttribute(&#x27;aria-live&#x27;,&#x27;polite&#x27;);

  async function refresh() {
    if (!credential || pending) return;
    pending = true;
    try {
      const result = await fetch(endpoint, {
        headers: {Authorization: &#x27;Bearer &#x27; + credential}, credentials: &#x27;omit&#x27;,
        cache: &#x27;no-store&#x27;, redirect: &#x27;error&#x27;, signal: AbortSignal.timeout(15000)

      if (result.status === 403) {
        credential = &#x27;&#x27;;

        status.textContent = &#x27;Private Events access denied.&#x27;;
        return;

        snapshot = next;
        render();

      const age = Math.max(0, Math.floor((Date.now() - snapshot.capturedAt) / 60000));
      status.textContent = &#x27;FireWatch Event Recording · synced &#x27; + age + &#x27; min ago&#x27; + (age &gt;= 75 ? &#x27; · overdue&#x27; : &#x27;&#x27;);
    } catch {
      status.textContent = snapshot ? &#x27;Refresh failed · showing the last Winterton snapshot&#x27; : &#x27;Private Winterton feed unavailable.&#x27;;
    } finally {

  source.addEventListener(&#x27;change&#x27;, () =&gt; {

  connect.addEventListener(&#x27;submit&#x27;, event =&gt; {
    event.preventDefault();
    if (pending) return;
    const input = connect.elements.namedItem(&#x27;events-key&#x27;);
    credential = input.value.trim();
    input.value = &#x27;&#x27;;
    refresh();
  });
  setInterval(() =&gt; {
    if (!document.hidden &amp;&amp; section.getClientRects().length) refresh();
  }, 60000);
  document.addEventListener(&#x27;visibilitychange&#x27;, () =&gt; {
    if (!document.hidden &amp;&amp; section.getClientRects().length) refresh();
  });
